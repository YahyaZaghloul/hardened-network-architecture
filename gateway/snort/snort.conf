# ======================================================================
# snort.conf — Snort IDS Configuration
# Version: 2.9.20 GRE (Build 82)
# Gateway VM — Hardened Network Architecture
# Run as: sudo snort -A console -q -c /etc/snort/snort.conf -i ens33
# ======================================================================

# -----------------------------------------------------------------------
# Step 1: Set the network variables
# -----------------------------------------------------------------------
# Internal networks monitored by Snort
var HOME_NET [192.168.10.0/24,192.168.20.0/24]
var EXTERNAL_NET !$HOME_NET

# Server-specific vars
var HTTP_SERVERS 192.168.20.10
var SSH_SERVERS  192.168.20.10
var DNS_SERVERS  $HOME_NET
var SMTP_SERVERS $HOME_NET
var SQL_SERVERS  $HOME_NET
var TELNET_SERVERS $HOME_NET
var FTP_SERVERS  $HOME_NET

# -----------------------------------------------------------------------
# Step 2: Configure server ports
# -----------------------------------------------------------------------
portvar HTTP_PORTS [80,443,8080,8443]
portvar SHELLCODE_PORTS !80
portvar ORACLE_PORTS 1024:
portvar SSH_PORTS 22
portvar FTP_PORTS [21,2100,3535]
portvar SIP_PORTS [5060,5061,5600]
portvar FILE_DATA_PORTS [$HTTP_PORTS,110,143]
portvar GTP_PORTS [2123,2152,3386]

# -----------------------------------------------------------------------
# Step 3: Configure the decoder
# -----------------------------------------------------------------------
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_tcpopt_alerts
config disable_ipopt_alerts

# -----------------------------------------------------------------------
# Step 4: Configure dynamic loaded libraries
# -----------------------------------------------------------------------
dynamicpreprocessor directory /usr/lib/x86_64-linux-gnu/snort_dynamicpreprocessor/
dynamicengine       /usr/lib/x86_64-linux-gnu/snort_dynamicengine/libsf_engine.so

# -----------------------------------------------------------------------
# Step 5: Configure preprocessors
# -----------------------------------------------------------------------
preprocessor normalize_ip4
preprocessor normalize_tcp: ips ecn stream

preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy windows detect_anomalies overlap_limit 10 min_fragment_length 100 timeout 180

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no, \
    max_tcp 262144, max_udp 131072, max_active_responses 2, min_response_seconds 5

preprocessor stream5_tcp: log_asymmetric_traffic no, policy windows, \
    detect_anomalies, require_3whs 180, overlap_limit 10, small_segments 3 bytes 150, \
    timeout 180, port_filter ports 21 22 23 25 42 53 79 80 109 110 111 113 119 135 136 137 \
    139 143 161 445 513 514 587 593 691 1433 1521 2100 3306 6665 6666 6667 6668 6669 7000 8080

preprocessor stream5_udp: timeout 180
preprocessor stream5_icmp: timeout 10

preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252 \
    compress_depth 65535 decompress_depth 65535

preprocessor http_inspect_server: server default \
    http_methods { GET POST PUT HEAD DELETE TRACE OPTIONS CONNECT } \
    chunked_logging max_chunk_length 500000 \
    iis_unicode_map 1252 \
    ascii no double_decode no non_rfc_char { 0x00 0x01 0x02 0x03 0x04 0x05 0x06 0x07 } \
    invalid_headers no \
    headersonly \
    no_alerts \
    ports { 80 443 8080 8443 }

preprocessor sfportscan: proto { all } memcap { 10000000 } sense_level { low }

preprocessor ssh: server_ports { 22 } autodetect max_client_bytes 19600 \
    max_encrypted_packets 20 max_server_version_len 100 \
    enable_respoverflow enable_ssh1crc32 enable_srvoverflow enable_protomismatch

# -----------------------------------------------------------------------
# Step 6: Configure output plugins
# -----------------------------------------------------------------------
output alert_fast:   /var/log/snort/alert
output log_tcpdump:  /var/log/snort/snort.log

# -----------------------------------------------------------------------
# Step 7: Customize your rule set
# -----------------------------------------------------------------------
var RULE_PATH     /etc/snort/rules
var SO_RULE_PATH  /etc/snort/so_rules
var PREPROC_RULE_PATH /etc/snort/preproc_rules

# Custom local rules (primary)
include $RULE_PATH/local.rules

# -----------------------------------------------------------------------
# Step 8: Customize preprocessor and decoder rule sets
# -----------------------------------------------------------------------
include $PREPROC_RULE_PATH/preprocessor.rules
include $PREPROC_RULE_PATH/decoder.rules
include $PREPROC_RULE_PATH/sensitive-data.rules
