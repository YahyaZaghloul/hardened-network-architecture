<VirtualHost *:80>
    ServerAdmin admin@youssef-lab.local
    ServerName  youssef-lab.local
    ServerAlias www.youssef-lab.local

    DocumentRoot /var/www/html

    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://youssef-lab.local/

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
