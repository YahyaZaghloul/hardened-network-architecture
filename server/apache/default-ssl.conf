<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin admin@youssef-lab.local
    ServerName  youssef-lab.local
    ServerAlias www.youssef-lab.local

    DocumentRoot /var/www/html

    ErrorLog  ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

    # ---------------------------------------------------------------
    # SSL/TLS Configuration
    # ---------------------------------------------------------------
    SSLEngine on

    # Self-signed certificate generated with gen-cert.sh
    SSLCertificateFile    /etc/ssl/certs/youssef-lab.crt
    SSLCertificateKeyFile /etc/ssl/private/youssef-lab.key

    # Disable weak protocols — TLS 1.2+ only
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Strong cipher suites only
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

    SSLHonorCipherOrder off
    SSLSessionTickets   off

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>
</VirtualHost>
</IfModule>
